# 本地私有配置模板
#
# 用法：复制成同目录下的 application.yml 再填值
#   cp config/application.example.yml config/application.yml
# （config/application.yml 已被 .gitignore 忽略，不会进版本库）
#
# 为什么需要它：src/main/resources/application.yml 里的开发默认值足够跑起本地环境，
# 唯一给不了的是**真实密钥**——GitHub client-secret 是真实凭据，不保留任何默认值。
# 本地要用 GitHub 登录，就在这里放一份自己的。
#
# 优先级：file:./config/application.yml > classpath:application.yml，
# 且它位于项目目录而非 src/main/resources，不会被打进 jar。
#
# 不填也能启动：GitHub 登录相关接口会失败，其余功能不受影响。

github:
  oauth:
    client-secret: your-github-oauth-client-secret

# 邮件：忘记密码的重置链接。
#
# ⚠️ **不填不会报错**：忘记密码接口照样回「已发送」，但实际只打一条 ERROR 日志
#    （防枚举的代价——对所有情况都返回同一句话）。所以配完**必须**看启动日志确认：
#        [MAIL] 发信已配置: from=xxx@qq.com     ← 这行才算配好
#        [MAIL] 未配置 spring.mail.username...   ← 还是这行 = 没生效
#
# ⚠️ QQ 邮箱这里填的是**授权码**，不是 QQ 密码：
#    QQ邮箱 → 设置 → 账户 → POP3/IMAP/SMTP 服务 → 开启 SMTP → 生成授权码（16 位，只显示一次）
#
# 配好后先打一发自检，能立刻区分「配置问题」和「业务问题」：
#    curl.exe -X POST "http://localhost:8080/api/dev/mail/check?to=你的另一个邮箱@example.com"
#
# ⚠️ 本文件是**会被提交的模板**，只放占位符。真实值一律写进同目录的
#    application.yml（已被 .gitignore 忽略）。2026-10-17 曾把真实 QQ 授权码
#    误写在这里并提交进 git，属于密钥泄露——已移除，且授权码已作废重生成。
spring:
  mail:
    username: your-qq@qq.com
    password: your_smtp_authorization_code
