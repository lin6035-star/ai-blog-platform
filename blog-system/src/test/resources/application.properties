spring.datasource.url=jdbc:h2:mem:blog_system_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# H2 内存库，schema.sql 与 data.sql 负责初始化
spring.sql.init.mode=always
# 2026-10-18：必须显式指定脚本编码。默认取平台编码（Windows 上是 GBK），
# 而 data.sql 是 UTF-8（含中文分类名/计划名）→ 中文会以乱码入库，
# 断言中文的用例必挂；此前没有中文断言所以一直没暴露。
spring.sql.init.encoding=UTF-8
spring.data.redis.database=0
spring.ai.vectorstore.elasticsearch.index-name=spring-ai-document-index-test
blog.ai.rag.corpus.initialize-schema=false
# 记忆侧同理：测试约定是不依赖真实 ES，开了之后 bean 初始化阶段就会发 HEAD 探测。
# 生产默认 true（记忆索引没有重建流程，全新 ES 必须靠它自动创建）。
blog.ai.rag.corpus.memory-initialize-schema=false
# 敏感配置固定值：让测试不依赖 application.yml 的开发默认值（后者将来可能被移除/加强校验）
jwt.secret=test-only-jwt-secret-with-at-least-32-chars
# 秒杀预热会在上下文启动阶段写 Redis，测试里由用例显式调用
blog.seckill.preheat-on-startup=false
# 状态流转任务在测试上下文里是真会跑的，会把用例造的活动在断言中途改成 ENDED。
# 用例显式调 SeckillLifecycleService 的方法，不受这个开关影响
blog.seckill.lifecycle-enabled=false
# 每日开场任务同理：它会在用例断言中途建出一场活动。用例直接调 SeckillDailyService
blog.seckill.daily.enabled=false
blog.ai.rag.health.initial-delay-ms=3600000
