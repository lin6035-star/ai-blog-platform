# Cloudflare 真实 IP 还原（2026-10-18）
#
# 用法：把本文件与其他 conf 一起放到 Nginx 的 conf.d/ 下（裸机 /etc/nginx/conf.d/，
#       Docker 挂载到 /etc/nginx/conf.d/），nginx -t && nginx -s reload 即可。
#       这些指令是 http 级上下文，conf.d 下会被主配置自动 include，不需要在 server 块里再写。
#
# 为什么必须要有它：
#   套了 Cloudflare 之后，源站看到的对端 IP 全是 CF 的边缘节点 IP。
#   本项目的 IP 限流（游客 AI 每日额度、登录失败 IP 维度、密码重置限流）都以「真实客户端 IP」
#   为计数键——不还原的话全站用户会共用一个/几个 CF IP，游客 10 次/天会被很快打满，
#   等于限流器全站失效（而且看起来像"误伤"）。
#
# 工作原理：
#   1. 只有来自下面这些 CF 网段的请求，Nginx 才用 CF-Connecting-IP 覆盖 $remote_addr；
#   2. 于是 nginx.conf 里 `proxy_set_header X-Real-IP $remote_addr;` 写出去的就是真实用户 IP；
#   3. 后端 ClientIpUtils 只信任 X-Real-IP —— 三层对齐，客户端伪造不了。
#
# ⚠️ CF 的网段会变（官方列表 https://www.cloudflare.com/ips/）。
#    升级做法：对照官网更新下面列表，或改成用 include 引入定期同步的文件。
# ⚠️ 只配了这个文件还不够：源站 80 端口最好在安全组/防火墙只放行 CF 网段，
#    否则绕过 Cloudflare 直连源站、自己伪造 X-Real-IP 仍可绕过限流。

# ---- Cloudflare IPv4 ----
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# ---- Cloudflare IPv6 ----
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;
