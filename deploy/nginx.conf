# Blog System Nginx 配置
# 服务器上放至：/etc/nginx/conf.d/blog.conf
# 重载配置：nginx -t && nginx -s reload

upstream blog_backend {
    server 127.0.0.1:8080;
}

server {
    listen 80;
    server_name 47.88.86.213;

    # 前端静态文件
    root /var/www/blog;
    index index.html;

    # 请求体上限：后端 multipart 配的是 10MB（application.yml），
    # Nginx 默认只有 1m —— 手机拍的照片基本都超 1MB，头像/文章插图会被 413 挡在门口，
    # 而且返回的是 Nginx 的 HTML 错误页，前端提示不可读（2026-10-17 上线审计 P0-4）。
    client_max_body_size 15m;

    # Gzip 压缩
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # 前端路由（SPA history mode）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ===== AI 流式接口（SSE）=====
    # 必须单独一段并关闭缓冲：Nginx 默认 proxy_buffering on，会把 SSE 攒成一批再吐，
    # 前端表现为「思考中」卡住然后内容一次性出现；proxy_read_timeout 默认 60s，
    # Agent/Workflow 长任务超过 60 秒直接 504（2026-10-17 上线审计 P0-3）。
    # 前缀 /api/ai/ 比 /api/ 长，Nginx 按最长前缀匹配，这里优先命中。
    location /api/ai/ {
        proxy_pass http://blog_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # API 反向代理到后端
    location /api/ {
        proxy_pass http://blog_backend;
        proxy_set_header Host $host;
        # 真实 IP 只由本行「覆盖」写入：$remote_addr 是 Nginx 看到的对端地址，
        # 客户端自己带 X-Real-IP 进来也会在这里被覆盖，无法伪造。
        # 后端 ClientIpUtils 只信这一个头（2026-10-17 上线审计：原先透传的
        # CF-Connecting-IP / X-Forwarded-For 是客户端可写的，实测换头即可绕过 IP 限流）。
        # ⚠️ 若前面挂 Cloudflare：不要在应用代码里恢复信任 CF-Connecting-IP，
        #    应在 Nginx 侧用 real_ip 模块（set_real_ip_from <CF 段> + real_ip_header CF-Connecting-IP）
        #    把 $remote_addr 还原成真实 IP，再由下面这行写入 X-Real-IP。
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
