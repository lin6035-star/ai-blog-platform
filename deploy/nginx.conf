# Blog System Nginx 配置
# 服务器上放至：/etc/nginx/conf.d/blog.conf（Docker 版挂载到 /etc/nginx/conf.d/default.conf）
# 重载配置：nginx -t && nginx -s reload
#
# ⚠️ 本配置假设站点走 Cloudflare（域名 hailin.kdns.fr，CF 免费 HTTPS）：
#    - 必须同时放进 conf.d/cloudflare-realip.conf，否则源站看到的都是 CF 节点 IP，
#      IP 限流（游客 AI 额度 / 登录失败计数）会全站共用同一份配额而失效。
#    - CF 的 SSL/TLS 模式决定源站怎么配：
#        Flexible ：CF→源站走 HTTP 80，**源站不要做 80→443 跳转**（会死循环变 525/522）；
#        Full/Full(strict)：CF→源站走 HTTPS 443，需要在这里加 443 证书块（用 Cloudflare Origin 证书）。
#    - 换域名/换服务器只改 server_name 与环境变量，其余不动。

upstream blog_backend {
    server 127.0.0.1:8080;
}

server {
    listen 80;
    # 用域名访问；直接用 IP 访问时落到这个默认 server 也能打开（单 server 场景）
    server_name hailin.kdns.fr;

    # 前端静态文件
    root /var/www/blog;
    index index.html;

    # 请求体上限：后端 multipart 配的是 10MB（application.yml），
    # Nginx 默认只有 1m —— 手机拍的照片基本都超 1MB，头像/文章插图会被 413 挡在门口，
    # 而且返回的是 Nginx 的 HTML 错误页，前端提示不可读（2026-10-17 上线审计 P0-4）。
    client_max_body_size 15m;

    # Gzip 压缩
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # 前端路由（SPA history mode）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ===== AI 流式接口（SSE）=====
    # 必须单独一段并关闭缓冲：Nginx 默认 proxy_buffering on，会把 SSE 攒成一批再吐，
    # 前端表现为「思考中」卡住然后内容一次性出现；proxy_read_timeout 默认 60s，
    # Agent/Workflow 长任务超过 60 秒直接 504（2026-10-17 上线审计 P0-3）。
    # 前缀 /api/ai/ 比 /api/ 长，Nginx 按最长前缀匹配，这里优先命中。
    location /api/ai/ {
        proxy_pass http://blog_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # API 反向代理到后端
    location /api/ {
        proxy_pass http://blog_backend;
        proxy_set_header Host $host;
        # 真实 IP 只由本行「覆盖」写入。前置条件是 cloudflare-realip.conf：
        # 只有来自 CF 网段的请求才会把 $remote_addr 换成 CF-Connecting-IP。
        # 后端 ClientIpUtils 只信任 X-Real-IP（2026-10-17 上线审计：原先透传的
        # CF-Connecting-IP / X-Forwarded-For 是客户端可写的，实测换头即可绕过 IP 限流）。
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
