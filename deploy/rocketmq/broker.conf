# RocketMQ Broker 配置（本地开发用）
#
# ⚠️ 最关键的一条是 brokerIP1，见下。这是 RocketMQ 容器化部署最经典的坑。
#
# 启动方式见同目录 README 或 docker-compose.yml。

brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0

# Broker 必须显式注册到同一 Docker 网络的 NameServer，否则客户端只能看到空路由。
namesrvAddr = rmqnamesrv:9876

# 消费位点等元数据的清理
deleteWhen = 04
fileReservedTime = 48

# 单机开发：异步刷盘 + 异步复制，本机崩溃才可能丢最后几条；
# 生产要按可靠性要求改成 SYNC_FLUSH（代价是吞吐）
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# ⚠️⚠️ 必须显式指定，否则 Broker 会把自己在**容器内网**的地址（172.x.x.x）
# 注册到 NameServer，而客户端跑在宿主机上 —— 拿到这个地址后根本连不上，
# 报错还特别误导（"connect to 172.17.0.2:10911 failed"）。
#
# 192.168.65.1 是 Docker Desktop 在宿主机上的网关地址：
# 容器侧看它是宿主机，宿主机侧看它是自己的网卡 —— 两边都能访问到。
brokerIP1 = 192.168.65.1

# 开发便利：发送到不存在的 topic 时自动创建
# ⚠️ 生产必须关掉（否则一个拼错的 topic 名会静默创建一个没人消费的 topic，消息堆着没人知道）
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true

# 消息保留
fileReservedTime = 72
